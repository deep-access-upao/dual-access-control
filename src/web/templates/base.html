<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acceso dual{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Dual Access</a>
    <nav aria-label="Navegación principal">
      <a href="/">Verificar</a>
      <a href="/users">Usuarios</a>
      <a href="/users/new">Registrar</a>
      <a href="/history">Historial</a>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer>Demo local · Las imágenes faciales no se versionan.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
